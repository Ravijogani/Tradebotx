name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend (typecheck, lint, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.app.json
      - run: npm run lint
      - run: npm run build

  python:
    name: Python bot scripts (syntax check + import smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m py_compile python_scripts/*.py python_scripts/backtest/*.py python_scripts/tests/*.py
      # Only the real third-party packages hybrid_trading_bot_multiuser.py
      # actually imports at module scope, minus the ones the harness stubs
      # out of sys.modules before import (MetaTrader5, supabase -- see
      # bot_loader.py) and google-generativeai (bot_loader falls back to a
      # stub for it too if unavailable). This intentionally isn't `pip
      # install -r python_scripts/requirements.txt` -- that file also lists
      # MetaTrader5, which is Windows-only and can't install on this
      # runner. If a new *real* top-level import is added to the bot file
      # that isn't one of the stubbed/faked ones, add it here too, or this
      # job will fail the same way it did when `requests` was missing.
      - run: pip install pandas numpy requests certifi
      # Real smoke test, not just a syntax check: imports the live bot file
      # with MT5/Supabase stubbed (see python_scripts/backtest/bot_loader.py)
      # and confirms module-level construction (AITradingConfig,
      # PatternRecognitionSystem, etc.) doesn't throw. This is exactly the
      # check that would have caught the PatternRecognitionSystem.patterns_db
      # AttributeError crash-on-first-run bug before it shipped.
      - name: Import smoke test (bot module loads with mocked MT5/Supabase)
        working-directory: python_scripts
        run: python -c "from backtest.bot_loader import import_bot_module; import_bot_module(); print('bot module imported cleanly')"
      # The unit suites. These were written alongside the fixes they cover but
      # lived outside the repo, so CI could not run them and nothing stopped a
      # later edit from quietly undoing a safety guarantee. That already
      # happened once: changing check_remote_stop's contract left a stale
      # expectation in test_bot_control.py that no automated check caught.
      #
      # They cover the things that are expensive to get wrong -- emergency
      # stop firing instantly on a running bot, fail-open on transport errors,
      # the startup grace that stops a booting bot killing itself, refusing to
      # trade on zero equity, currency-exposure netting, the risk ceilings,
      # and the decision journal's serialisation.
      - name: Unit tests
        working-directory: python_scripts
        run: python tests/run_all.py

  edge_functions:
    name: Supabase edge functions (syntax + transpile check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Edge functions had NO automated check of any kind before this -- the
      # audit found zero test/lint coverage for supabase/functions, so a
      # syntax error or a bad edit only surfaced on deploy. tsc can't
      # type-resolve Deno's npm:/https: specifiers, so this parses and
      # transpiles every function instead: it catches syntax errors, broken
      # edits and malformed TS without needing the Deno toolchain.
      - name: Parse and transpile every edge function
        run: |
          node -e "
          const ts = require('typescript'), fs = require('fs'), path = require('path');
          const root = 'supabase/functions';
          let failed = 0, checked = 0;
          const walk = (d) => fs.readdirSync(d, { withFileTypes: true }).flatMap((e) => {
            const p = path.join(d, e.name);
            return e.isDirectory() ? walk(p) : (p.endsWith('.ts') ? [p] : []);
          });
          for (const f of walk(root)) {
            checked++;
            const src = fs.readFileSync(f, 'utf8');
            const sf = ts.createSourceFile(f, src, ts.ScriptTarget.ESNext, true, ts.ScriptKind.TS);
            const diags = sf.parseDiagnostics || [];
            if (diags.length) {
              failed++;
              console.error('PARSE ERROR ' + f + ': ' + diags.map((d) => ts.flattenDiagnosticMessageText(d.messageText, ' ')).join('; '));
              continue;
            }
            try {
              ts.transpileModule(src, { compilerOptions: { target: ts.ScriptTarget.ESNext, module: ts.ModuleKind.ESNext } });
            } catch (e) {
              failed++;
              console.error('TRANSPILE FAIL ' + f + ': ' + e.message);
            }
          }
          console.log('checked ' + checked + ' edge function file(s), ' + failed + ' failed');
          process.exit(failed ? 1 : 0);
          "
