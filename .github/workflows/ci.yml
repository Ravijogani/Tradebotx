name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend (typecheck, lint, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.app.json
      - run: npm run lint
      - run: npm run build

  python:
    name: Python bot scripts (syntax check + import smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m py_compile python_scripts/*.py python_scripts/backtest/*.py
      # Only the real third-party packages hybrid_trading_bot_multiuser.py
      # actually imports at module scope, minus the ones the harness stubs
      # out of sys.modules before import (MetaTrader5, supabase -- see
      # bot_loader.py) and google-generativeai (bot_loader falls back to a
      # stub for it too if unavailable). This intentionally isn't `pip
      # install -r python_scripts/requirements.txt` -- that file also lists
      # MetaTrader5, which is Windows-only and can't install on this
      # runner. If a new *real* top-level import is added to the bot file
      # that isn't one of the stubbed/faked ones, add it here too, or this
      # job will fail the same way it did when `requests` was missing.
      - run: pip install pandas numpy requests certifi
      # Real smoke test, not just a syntax check: imports the live bot file
      # with MT5/Supabase stubbed (see python_scripts/backtest/bot_loader.py)
      # and confirms module-level construction (AITradingConfig,
      # PatternRecognitionSystem, etc.) doesn't throw. This is exactly the
      # check that would have caught the PatternRecognitionSystem.patterns_db
      # AttributeError crash-on-first-run bug before it shipped.
      - name: Import smoke test (bot module loads with mocked MT5/Supabase)
        working-directory: python_scripts
        run: python -c "from backtest.bot_loader import import_bot_module; import_bot_module(); print('bot module imported cleanly')"
